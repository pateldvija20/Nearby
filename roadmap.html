<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nearby Roadmap</title>
<meta name="description" content="Nearby project roadmap: what's planned, in progress, in review and done.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0b; --surface:#151515; --surface-2:#1c1c1c; --border:#262626; --border-2:#333;
    --text:#f4f4f4; --muted:#a3a3a3; --faint:#6b6b6b; --accent:#ff7556;
    --planned:#3dadff; --progress:#ffc943; --review:#9b6bff; --done:#4cd97b;
    --radius:14px;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;color:inherit}

  /* top bar */
  .bar{position:sticky;top:0;z-index:5;background:rgba(11,11,11,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .bar-in{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;text-decoration:none}
  .logo{width:32px;height:32px;border-radius:9px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:16px}
  .sep{width:1px;height:22px;background:var(--border-2)}
  nav{display:flex;gap:4px}
  nav a{text-decoration:none;color:var(--faint);font-weight:500;font-size:15px;padding:16px 10px;position:relative}
  nav a.on{color:var(--text)}
  nav a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-13px;height:2px;background:var(--text);border-radius:2px}
  nav a:hover{color:var(--text)}
  .spacer{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 14px;min-width:0}
  .search input{background:none;border:0;outline:0;color:var(--text);font-size:14px;width:180px;min-width:0}
  .search svg{flex:none;color:var(--faint)}

  /* hero */
  main{max-width:1440px;margin:0 auto;padding:32px 24px 80px}
  .hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
  h1{font-size:40px;letter-spacing:-.02em;margin:0 0 6px;font-weight:600}
  .sub{color:var(--muted);margin:0;font-size:15px;max-width:620px;line-height:1.5}
  .stats{display:flex;gap:8px;flex-wrap:wrap}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;min-width:96px}
  .stat b{display:block;font-size:22px;font-weight:600}
  .stat span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:4px 0 24px;display:flex}
  .progress i{display:block;height:100%}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
  .chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--border-2);color:var(--text)}
  .chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

  /* board */
  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;align-items:start}
  .col-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 2px}
  .col-h h2{font-size:18px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
  .col-h .n{color:var(--faint);font-size:13px;font-weight:500}
  .col-sub{color:var(--muted);font-size:13px;margin:0 2px 14px}
  .cards{display:flex;flex-direction:column;gap:12px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px 12px;cursor:pointer;transition:border-color .15s,background .15s;text-align:left;width:100%}
  .card:hover{border-color:var(--border-2);background:#181818}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tag{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
  .tag svg{width:14px;height:14px}
  .card h3{font-size:15px;font-weight:600;margin:8px 0 6px;line-height:1.35}
  .desc{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card.open .desc{-webkit-line-clamp:unset;display:block}
  .meta{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--muted)}
  .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0b0b0b;flex:none}
  .when{margin-left:auto;border:1px solid var(--border);border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .empty{color:var(--faint);font-size:13px;padding:20px;border:1px dashed var(--border);border-radius:var(--radius);text-align:center}

  footer{max-width:1440px;margin:0 auto;padding:0 24px 40px;color:var(--faint);font-size:12.5px}

  @media (max-width:1180px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:720px){
    .bar-in{padding:10px 16px;gap:12px}
    .sep,nav a:not(.on){display:none}
    .search input{width:110px}
    main{padding:24px 16px 64px}
    h1{font-size:32px}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
    .stat{min-width:0;padding:8px 10px}
    .stat span{font-size:11px}
    .board{grid-template-columns:minmax(0,1fr);gap:28px}
    footer{padding:0 16px 32px}
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#"><span class="logo">N</span>Nearby</a>
    <span class="sep"></span>
    <nav>
      <a class="on" href="#">Roadmap</a>
      <a href="https://www.figma.com/design/MAABKnUzZeUcHxZaz8Xa2b" target="_blank" rel="noopener">Figma file</a>
      <a href="nearby.md">Decision log</a>
    </nav>
    <span class="spacer"></span>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search" aria-label="Search roadmap"></label>
  </div>
</header>

<main>
  <section class="hero">
    <div>
      <h1>Roadmap</h1>
      <p class="sub">Nearby: a food &amp; drink diary + wishlist where crawls are walks. Everything done so far, what's being worked on, what's waiting for review, and what comes next.</p>
    </div>
    <div class="stats" id="stats"></div>
  </section>
  <div class="progress" id="bar" aria-hidden="true"></div>
  <div class="chips" id="chips" role="group" aria-label="Filter by area"></div>
  <section class="board" id="board"></section>
</main>
<footer id="foot"></footer>

<script>
const UPDATED = "Oct 14, 2026";
const OWNERS = { D:{name:"Dvija", c:"#ff7556"}, C:{name:"Claude", c:"#d0d0d0"}, B:{name:"Dvija + Claude", c:"#ffc943"} };
const CATS = {
  Discovery:{c:"#3dadff", i:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'},
  Flows:{c:"#9b6bff", i:'<circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6h6a4 4 0 0 1 4 4v6"/>'},
  Research:{c:"#4cd97b", i:'<path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l4-5 3 3 4-6"/>'},
  Brand:{c:"#ff7556", i:'<path d="M12 3l2.6 5.6L20 9.3l-4 4 1 5.7-5-2.8-5 2.8 1-5.7-4-4 5.4-.7z"/>'},
  "Design system":{c:"#ffc943", i:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'},
  UI:{c:"#3dadff", i:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>'},
  "Case study":{c:"#e6e6e6", i:'<path d="M5 3h10l4 4v14H5z"/><path d="M9 12h6M9 16h6"/>'},
  Ops:{c:"#a3a3a3", i:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'}
};
const COLS = [
  {k:"planned", t:"Planned", s:"Committed and queued", c:"var(--planned)"},
  {k:"progress", t:"In progress", s:"Actively being worked on", c:"var(--progress)"},
  {k:"review", t:"In review", s:"Built, waiting for Dvija's audit", c:"var(--review)"},
  {k:"done", t:"Done", s:"Shipped to the Figma file", c:"var(--done)"}
];

// Edit this list to update the board.
const ITEMS = [
  // ---------- Planned ----------
  {s:"planned",cat:"Brand",o:"B",d:"Next",t:"Brand story",x:"Write Nearby's brand story from the three competitor takeaways: own the whole loop (save → walk → remember), movement without the scoreboard, and editorial craft with scrapbook heart and party energy."},
  {s:"planned",cat:"Brand",o:"D",d:"Next",t:"Moodboard + vibe",x:"Claude writes the moodboard brief from the brand story; Dvija builds the moodboard. Covers photography, texture (stickers, notes, scrapbook), colour mood and type feel."},
  {s:"planned",cat:"Brand",o:"B",d:"Oct 19",t:"Brand identity",x:"Logo/wordmark, colour palette, type pairing and voice, chosen from two style tiles applied to the same screen."},
  {s:"planned",cat:"Design system",o:"C",d:"Oct 19",t:"Design foundations",x:"Tokens for colour, type, spacing, radius and elevation, dark and light, including what the visual language does on a map surface."},
  {s:"planned",cat:"Design system",o:"C",d:"Oct 20",t:"Component kit",x:"Editable Figma components for buttons, chips, cards, stop/dish cards, map pins, sheets, modals, nav bar and progress, with empty, loading, error and stale states as real components."},
  {s:"planned",cat:"UI",o:"B",d:"Oct 21",t:"Hi-fi UI · Batch 1: core loop",x:"Hi-fi boilerplate UI (no wireframes) for Build a crawl (C1–C8) and Walk (W1–W7, pause, auto-resume, lingering nudge), built from the component kit, one flow at a time: Claude lists the screens, Dvija audits, then Claude builds."},
  {s:"planned",cat:"UI",o:"B",d:"Oct 21",t:"Hi-fi UI · Finish + story",x:"Completion and unfinished states, badge and coupon reveal, keep/discard diary entry, three Instagram story templates, and sign-up at the end of the first crawl."},
  {s:"planned",cat:"UI",o:"B",d:"Oct 22",t:"Hi-fi UI · Onboarding, Home, Map, Diary, Profile",x:"Guest onboarding, Home discovery modules, the Map tab (Explore default, toggle to Mine), the Diary (entries + wishlist of places and dishes) and Profile."},
  {s:"planned",cat:"UI",o:"C",d:"Oct 22",t:"Edge + system states",x:"Offline, location denied, Apple Health not connected, dish sold out, place closed, abandoned crawl (keeps running + notification), and app closed ending a crawl."},
  {s:"planned",cat:"UI",o:"C",d:"Oct 22",t:"Wire the Figma prototype",x:"Connect the hero path end to end: setup → generated crawl → walk → stop check-in → finish → story."},
  {s:"planned",cat:"Case study",o:"D",d:"Oct 22",t:"Walkthrough video + hero GIF",x:"A 60–90 second prototype walkthrough plus a short GIF of the magic moment."},
  {s:"planned",cat:"Case study",o:"B",d:"Oct 23",t:"Write the case study",x:"Problem, bet, rejected options and outcome, written from the decision log in nearby.md."},
  {s:"planned",cat:"Case study",o:"D",d:"Oct 26",t:"Lay out + publish the case study",x:"Lay it out in the portfolio boilerplate, export visuals, publish, and fill in the case study and Figma links."},
  {s:"planned",cat:"Ops",o:"C",d:"Anytime",t:"Clear the outdated FigJam section",x:"Remove the old 'Build a crawl' section (8:170) from the FigJam board now that flows live in the design file."},

  // ---------- In progress ----------
  {s:"progress",cat:"Research",o:"D",d:"Oct 14",t:"Collect brand visuals for 12 competitors",x:"Fill the 108 empty image slots in the brand analysis frames. Each slot has a caption saying which image to capture and what it shows about the brand (icon, signature screen, imagery, social, website)."},
  {s:"progress",cat:"Research",o:"D",d:"Oct 14",t:"Capture flow screens for 10 apps",x:"Five screens per key journey for Nike Run Club, Posh, Bond, Polarsteps, Garmin Connect, Meetup, Corner, Rodeo, Mindtrip and Once, from Mobbin's free tier or by screen-recording the free apps."},

  // ---------- In review ----------
  {s:"review",cat:"Research",o:"C",d:"Oct 14",t:"Flow analysis · relevant journeys per app",x:"Built from Dvija's edited template: each app keeps only its most relevant journeys (1–3) with a 'How their flow is different' summary. NRC and Polarsteps have 3, Garmin and Meetup have 1, the rest have 2."},
  {s:"review",cat:"Ops",o:"C",d:"Oct 14",t:"Roadmap page",x:"This page: a UserJot-style roadmap for every Nearby task, pushed to GitHub with the project folder."},
  {s:"review",cat:"Flows",o:"C",d:"Oct 14",t:"Confirm three flow defaults",x:"Guest 'not now' saves on the device; the app picks which place the coupon comes from; 'Continue last crawl' resumes a running crawl."},

  // ---------- Done ----------
  {s:"done",cat:"Ops",o:"C",d:"Oct 14",t:"Figma file organised into pages",x:"00 Components · 01 App map · 02 Competitors: brand analysis · 03 Competitors: maps & takeaways · 04 Competitors: flow analysis · 99 Archive."},
  {s:"done",cat:"Research",o:"C",d:"Oct 14",t:"User flow analysis template + 10 apps",x:"A new dark template (name, key journeys, how the flow is different, screen slots), filled for 10 apps using their real flow lists from Mobbin."},
  {s:"done",cat:"Research",o:"C",d:"Oct 14",t:"Shot captions in every brand image slot",x:"108 captions across 12 brands, each naming the image to capture and the brand element it communicates."},
  {s:"done",cat:"Research",o:"C",d:"Oct 14",t:"Competitor section in dark mode",x:"Brand frames, maps and takeaways moved to the #0B0B0B dark theme; images cleared to placeholders, app icons kept on the maps."},
  {s:"done",cat:"Research",o:"C",d:"Oct 14",t:"Wanderboat AI added as competitor 12",x:"New brand frame with the six answers, placed on both maps. It's the closest competitor: search by vibe, but it stops at planning."},
  {s:"done",cat:"Brand",o:"C",d:"Oct 14",t:"Three takeaways for the brand story",x:"Own the whole loop · movement without the scoreboard · editorial craft, scrapbook heart, party energy."},
  {s:"done",cat:"Research",o:"C",d:"Oct 14",t:"Positioning 2×2: Plan ↔ Remember × Food ↔ Movement",x:"Every competitor owns one beat; nobody connects a food wishlist to a walk and then to a memory. That gap is where Nearby sits."},
  {s:"done",cat:"Research",o:"C",d:"Oct 14",t:"Affinity map: brand vibe",x:"Playful ↔ Refined × Utility ↔ Lifestyle. No food brand sits in playful × lifestyle, which is Nearby's target."},
  {s:"done",cat:"Research",o:"C",d:"Oct 14",t:"Competitor brand analysis · 11 brands",x:"Beli, The Infatuation, Google Maps lists, Corner, Mapstr, Strava, AllTrails, Polarsteps, Partiful, Bon Appétit and Luma: what each owns, vibe in 3 words, colour/type/imagery, a pattern to borrow, what to avoid, and how it handles saving → going → remembering."},
  {s:"done",cat:"Flows",o:"C",d:"Oct 14",t:"Macro-level app map",x:"A one-screen overview of the whole app above the detailed app map."},
  {s:"done",cat:"Flows",o:"C",d:"Oct 14",t:"Light-mode test, reverted to dark",x:"The app map was tried in light mode, then returned to dark."},
  {s:"done",cat:"Flows",o:"B",d:"Oct 14",t:"Full app map",x:"Spine Onboarding → Home → Build a crawl → Walk → Finish + story, connected screen-to-screen, plus Map, Diary, Profile and System states. Steps count from Start walk; guest until the first crawl; tabs Home · Map · Diary · Profile."},
  {s:"done",cat:"Flows",o:"B",d:"Oct 14",t:"Completion, reward and coupon rules",x:"Complete = step goal reached. Not reached → unfinished: no badge or coupon, steps still count, keep/discard the entry. Skipped stops → complete + badge, no coupon. One coupon per crawl, only if every stop is visited and every dish photo matches."},
  {s:"done",cat:"Flows",o:"C",d:"Oct 14",t:"Walk flow v2",x:"W1–W7 with manual pause and auto-pause/auto-resume, a 'Lingering?' info nudge with no time policing, dish sold out → swap at the stop, end early, running late."},
  {s:"done",cat:"Flows",o:"C",d:"Oct 14",t:"Build a crawl flow v2",x:"Mood quiz merged into setup (C1) with time commitment and start time; swaps and 'doesn't fit' as modals; regenerate the whole crawl from C3 and C7; decision diamonds D1–D3."},
  {s:"done",cat:"Design system",o:"C",d:"Oct 14",t:"Flow components in Figma",x:"Editable 'Flow node' (Screen, Modal, Popup, Check, State, Flow) and 'Path label' (Happy, Alt, No, Back) components in a colour-coded dark style."},
  {s:"done",cat:"Ops",o:"B",d:"Oct 14",t:"Moved from Paper to Figma",x:"Paper and FigJam dropped from the workflow; everything lives in the Nearby design file."},
  {s:"done",cat:"Discovery",o:"B",d:"Oct 13",t:"Crawl builder decisions",x:"The user chooses the number of stops (no default), step goal (daily/weekly), place and food type, source (wishlist or surprise), route shape (loop / one-way / surprise), time commitment and start time. Swap places or dishes before starting; Apple Health connected."},
  {s:"done",cat:"Discovery",o:"B",d:"Oct 13",t:"Discovery + concept pivot",x:"Pivoted from events to food & drink only: a diary + wishlist where crawls are guilt-free walks. A stop completes with a photo of the chosen dish; the walk ends in an Instagram story; calories are opt-in."}
];

const $ = s => document.querySelector(s);
let filter = "All", query = "";
const esc = s => s.replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const icon = cat => `<svg viewBox="0 0 24 24" fill="none" stroke="${CATS[cat].c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${CATS[cat].i}</svg>`;

function renderStats(){
  const total = ITEMS.length;
  $("#stats").innerHTML = COLS.map(c => {
    const n = ITEMS.filter(i => i.s === c.k).length;
    return `<div class="stat"><b>${n}</b><span><i class="dot" style="background:${c.c}"></i>${c.t}</span></div>`;
  }).join("");
  $("#bar").innerHTML = [...COLS].reverse().map(c => `<i style="width:${ITEMS.filter(i=>i.s===c.k).length/total*100}%;background:${c.c}"></i>`).join("");
}
function renderChips(){
  const cats = ["All", ...Object.keys(CATS).filter(k => ITEMS.some(i => i.cat === k))];
  $("#chips").innerHTML = cats.map(c => `<button class="chip" aria-pressed="${c===filter}" data-c="${c}">${c==="All"?"":`<i class="dot" style="background:${CATS[c].c}"></i>`}${c}</button>`).join("");
}
function renderBoard(){
  const match = i => (filter === "All" || i.cat === filter) && (!query || (i.t + " " + i.x + " " + i.cat).toLowerCase().includes(query));
  $("#board").innerHTML = COLS.map(c => {
    const list = ITEMS.filter(i => i.s === c.k && match(i));
    return `<div class="col"><div class="col-h"><h2><i class="dot" style="background:${c.c}"></i>${c.t}</h2><span class="n">${list.length}</span></div><p class="col-sub">${c.s}</p><div class="cards">${
      list.length ? list.map(i => { const o = OWNERS[i.o]; return `<article class="card" tabindex="0" aria-expanded="false">
        <div class="tag">${icon(i.cat)}${i.cat}</div>
        <h3>${esc(i.t)}</h3><p class="desc">${esc(i.x)}</p>
        <div class="meta"><span class="av" style="background:${o.c}">${o.name[0]}</span>${o.name}<span class="when">${i.d}</span></div></article>`; }).join("")
      : `<div class="empty">Nothing here${query||filter!=="All"?" for this filter":""}</div>`}</div></div>`;
  }).join("");
}
$("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if(!b) return; filter = b.dataset.c; renderChips(); renderBoard(); });
$("#q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); renderBoard(); });
$("#board").addEventListener("click", e => { const c = e.target.closest(".card"); if(!c) return; c.classList.toggle("open"); c.setAttribute("aria-expanded", c.classList.contains("open")); });
$("#board").addEventListener("keydown", e => { if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("card")){ e.preventDefault(); e.target.click(); } });
$("#foot").textContent = `Updated ${UPDATED} · ${ITEMS.length} items · Click a card to read it in full.`;
renderStats(); renderChips(); renderBoard();
</script>
</body>
</html>
